<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>h03 — Cursor list (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: stretch; justify-content: center; gap: 40px; }
  .content > .eyebrow { align-self: center; }
  .content > .headline { text-align: center; }

  .list { position: relative; display: flex; flex-direction: column; gap: 26px; }

  /* Row = card ngang: squircle icon + label. .row-label 34px trong box ~700 = ~46 ký tự */
  .row {
    display: flex; align-items: center; gap: 26px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow-soft);
    padding: 28px 34px;
    opacity: 0;
  }
  .row .sq { flex: none; }
  .row-label { margin: 0; font-size: 34px; font-weight: 600; line-height: 1.3; color: var(--ink); }

  /* Trạng thái "đã click": viền + nền plum nhạt do GSAP tween trực tiếp */
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <div class="eyebrow" style="--dot: var(--sage)">Trong video có gì</div>
    <h1 class="headline sm">Con agent này <span class="accent">tự làm</span> 4 việc</h1>

    <div class="list">
      <div class="row"><div class="sq sm sky"><img src="../shared/emoji/magnifying_glass_tilted_left.png" alt=""></div><p class="row-label">Quét tin AI mới trong 24 giờ</p></div>
      <div class="row"><div class="sq sm lav"><img src="../shared/emoji/brain.png" alt=""></div><p class="row-label">Lọc tin đáng đọc, bỏ tin rác</p></div>
      <div class="row"><div class="sq sm peach"><img src="../shared/emoji/page_facing_up.png" alt=""></div><p class="row-label">Viết tóm tắt tiếng Việt</p></div>
      <div class="row"><div class="sq sm sage"><img src="../shared/emoji/rocket.png" alt=""></div><p class="row-label">Gửi báo cáo lúc 8 giờ sáng</p></div>

      <div class="cursor"><div class="cursor-outline"></div><div class="cursor-fill"></div></div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  async function init() {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const DUR = 7.0;
    const tl = gsap.timeline({ paused: true });
    const EASE = 'power3.out';

    const list = document.querySelector('.list');
    const rows = gsap.utils.toArray('.row');
    const cursor = document.querySelector('.cursor');

    // Đo toạ độ sau fonts.ready (giống v15) — tip cursor nhắm mép phải label
    function targetFor(el, dx, dy) {
      const base = list.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: (r.left - base.left) + r.width * dx, y: (r.top - base.top) + r.height * dy };
    }

    tl.fromTo('.eyebrow', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .4, ease: EASE }, .10)
      .fromTo('.headline', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, .26)
      .fromTo(rows, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5, ease: EASE, stagger: .13 }, .55);

    // Cursor lần lượt ghé từng dòng và "click" — dòng sáng lên như được tick chọn
    const p0 = targetFor(rows[0], 0.86, 0.95);
    tl.set(cursor, { x: p0.x + 60, y: p0.y + 140 })
      .to(cursor, { opacity: 1, duration: .2 }, 1.45);

    let t = 1.65;
    rows.forEach((row, i) => {
      const p = targetFor(row, 0.86, 0.62);
      tl.to(cursor, { x: p.x, y: p.y, duration: .42, ease: 'power2.inOut' }, t);
      // click: cursor nén + row nén rồi nảy, nền chuyển plum nhạt + viền plum
      tl.to(cursor, { scale: .8, duration: .09, ease: 'power1.in' }, t + .46)
        .to(cursor, { scale: 1, duration: .14, ease: 'back.out(2)' }, t + .55)
        .to(row, { scale: .97, duration: .09, ease: 'power1.in' }, t + .46)
        .to(row, { scale: 1, duration: .18, ease: 'back.out(2)' }, t + .55)
        .to(row, { backgroundColor: '#EFECFF', borderColor: 'rgba(74,58,224,.35)', duration: .28, ease: EASE }, t + .5);
      t += 1.0;
    });

    // Cursor lùi ra rồi mờ
    tl.to(cursor, { x: p0.x + 120, y: p0.y + 420, opacity: 0, duration: .5, ease: 'power2.in' }, t + .1);

    tl.set({}, {}, DUR);
    window.__TL = tl;
    window.__DUR = DUR;
    window.__timelines = window.__timelines || {};
    window.__timelines['h03-cursor-list'] = tl;
    window.__READY = true;
  }
  init();
})();
</script>
</body>
</html>

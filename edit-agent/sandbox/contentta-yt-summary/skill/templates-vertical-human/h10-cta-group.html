<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>h10 — CTA xem video đầy đủ (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: center; justify-content: center; gap: 54px; }
  .content > .headline { text-align: center; }

  /* Card video: tape dán, tên video gốc + nút Xem để cursor bấm */
  .gcard {
    position: relative;
    width: 880px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 30px;
    box-shadow: var(--shadow-lift);
    padding: 52px 54px 46px;
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    transform: rotate(-0.8deg);
    opacity: 0;
  }
  .gcard .tape { --tape-tilt: -4deg; }

  .grow { display: flex; align-items: center; gap: 26px; }
  .grow .sq { flex: none; }
  .gname { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 50px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .gsub { margin: 6px 0 0; font-size: 27px; color: var(--ink-soft); }

  .join-btn {
    position: relative; display: inline-flex; align-items: center; gap: 16px;
    padding: 24px 56px; border-radius: 999px;
    border: 2px solid transparent;
    background: var(--plum); color: #fff;
    font-size: 38px; font-weight: 700; letter-spacing: -.01em;
    box-shadow: 0 16px 36px rgba(74,58,224,.34);
    opacity: 0;
  }
  .join-btn .icon-wrap { position: relative; width: 30px; height: 30px; flex: none; }
  .icon-play { position: absolute; inset: 0; }
  .icon-play::before {
    content: ''; position: absolute; left: 7px; top: 3px;
    border-style: solid; border-width: 12px 0 12px 20px;
    border-color: transparent transparent transparent currentColor;
  }

  /* Dòng chỉ chỗ lấy link video, ~45 ký tự */
  .how { display: flex; align-items: center; gap: 16px; opacity: 0; }
  .how p { margin: 0; font-size: 34px; font-weight: 600; color: var(--ink); }
  .how .accent { font-size: 38px; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <h1 class="headline">Xem <span class="accent">bản đầy đủ</span>?</h1>

    <div class="gcard">
      <div class="tape"></div>
      <div class="grow">
        <div class="sq lg rose"><img src="../shared/emoji/play_button.png" alt=""></div>
        <div>
          <p class="gname">Video gốc trên YouTube</p>
          <p class="gsub">Dài hơn, chi tiết từng bước</p>
        </div>
      </div>
      <div class="join-btn">
        <span class="icon-wrap"><span class="icon-play"></span></span>
        Xem video
      </div>
      <div class="cursor"><div class="cursor-outline"></div><div class="cursor-fill"></div></div>
    </div>

    <div class="how">
      <p>Link video ngay <span class="accent">dưới bình luận</span></p>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  async function init() {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const DUR = 6.0;
    const tl = gsap.timeline({ paused: true });
    const EASE = 'power3.out';

    const gcard = document.querySelector('.gcard');
    const cursor = document.querySelector('.cursor');
    const joinBtn = document.querySelector('.join-btn');

    function targetFor(el, dx, dy) {
      const base = gcard.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: (r.left - base.left) + r.width * dx, y: (r.top - base.top) + r.height * dy };
    }

    tl.fromTo('.headline', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .55, ease: 'back.out(1.3)' }, .10)
      .fromTo('.gcard', { opacity: 0, y: 60, rotation: -3.4 }, { opacity: 1, y: 0, rotation: -0.8, duration: .6, ease: 'back.out(1.3)' }, .55)
      .fromTo('.join-btn', { opacity: 0, y: 20, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: EASE }, 1.05);

    const pBtn = targetFor(joinBtn, 0.32, 0.44);
    const pStart = { x: pBtn.x + 100, y: pBtn.y + 180 };

    tl.set(cursor, { x: pStart.x, y: pStart.y })
      .to(cursor, { opacity: 1, duration: .2 }, 1.55)
      .to(cursor, { x: pBtn.x, y: pBtn.y, duration: .5, ease: 'power2.inOut' }, 1.72);

    // Click: nút nén, nền plum -> trắng viền, chữ giữ nguyên
    tl.to(cursor, { scale: .8, duration: .1, ease: 'power1.in' }, 2.30)
      .to(cursor, { scale: 1, duration: .16, ease: 'back.out(2)' }, 2.40)
      .to(joinBtn, { scale: .95, duration: .1, ease: 'power1.in' }, 2.30)
      .to(joinBtn, { scale: 1, duration: .2, ease: 'back.out(2)' }, 2.40)
      .to(joinBtn, { backgroundColor: '#FFFFFF', color: '#4A3AE0', borderColor: 'rgba(23,19,13,.14)', boxShadow: '0 4px 14px rgba(23,19,13,.08)', duration: .34, ease: EASE }, 2.42);

    tl.to(cursor, { x: pStart.x, y: pStart.y, opacity: 0, duration: .5, ease: 'power2.in' }, 2.95)
      .fromTo('.how', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, 3.15);

    // Idle: dòng link nhún nhẹ nhắc hành động
    tl.to('.how', { scale: 1.04, duration: .7, ease: 'sine.inOut', yoyo: true, repeat: 2, transformOrigin: '50% 50%' }, 3.9);

    tl.set({}, {}, DUR);
    window.__TL = tl;
    window.__DUR = DUR;
    window.__timelines = window.__timelines || {};
    window.__timelines['h10-cta-group'] = tl;
    window.__READY = true;
  }
  init();
})();
</script>
</body>
</html>

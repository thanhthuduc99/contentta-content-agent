<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>h07 — Quote highlight (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: flex-start; justify-content: center; gap: 48px; }

  /* Dấu nháy mở vẽ bằng CSS (2 giọt), không glyph hệ thống */
  .qmark { display: flex; gap: 10px; opacity: 0; }
  .qmark i {
    width: 34px; height: 46px; background: var(--plum-2);
    border-radius: 4px 18px 18px 18px;
    transform: rotate(180deg);
  }

  /* Quote 62px = 36 ký tự/dòng (bảng đo .headline.sm). Mỗi dòng 1 span để stagger */
  .quote { display: flex; flex-direction: column; gap: 10px; }
  .quote .line { opacity: 0; }

  /* 2 cụm được bút dạ quét: --hl-x đi 0 → 1 bằng GSAP (CSS var tween).
     KHÔNG override ::before — chỉ set biến, pseudo trong base đọc var(--hl-x). */
  .hl { --hl-x: 0; }

  .by { display: flex; align-items: center; gap: 18px; opacity: 0; }
  .by .sq { flex: none; }
  .by p { margin: 0; font-size: 29px; font-weight: 600; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <div class="eyebrow" style="--dot: var(--lavender)">Câu đắt nhất video</div>

    <div class="qmark"><i></i><i></i></div>

    <h1 class="headline sm quote">
      <span class="line">Skill giống <span class="hl">công thức nấu ăn</span>.</span>
      <span class="line">Công thức đúng thì</span>
      <span class="line">ai nấu cũng <span class="hl hl2"><span class="accent">ra đúng món</span></span>.</span>
    </h1>

    <div class="by">
      <div class="sq xs gold"><img src="../shared/emoji/speech_balloon.png" alt=""></div>
      <p>Thành, phút 03:20 trong video</p>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  async function init() {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const DUR = 6.0;
    const tl = gsap.timeline({ paused: true });
    const EASE = 'power3.out';

    tl.fromTo('.eyebrow', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .4, ease: EASE }, .10)
      .fromTo('.qmark', { opacity: 0, y: 20, rotation: -8 }, { opacity: 1, y: 0, rotation: 0, duration: .45, ease: 'back.out(1.5)' }, .30)
      .fromTo('.quote .line', { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .5, ease: EASE, stagger: .16 }, .55);

    // Bút dạ quét qua 2 cụm, lần lượt — tween thẳng vào pseudo qua CSS var không được,
    // nên tween scaleX của ::before bằng cách animate biến trên element cha (GSAP hiểu CSS var)
    tl.to('.hl:not(.hl2)', { '--hl-x': 1, duration: .5, ease: 'power1.inOut' }, 1.65)
      .to('.hl2', { '--hl-x': 1, duration: .55, ease: 'power1.inOut' }, 2.35);

    tl.fromTo('.by', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, 3.0);

    tl.set({}, {}, DUR);
    window.__TL = tl;
    window.__DUR = DUR;
    window.__timelines = window.__timelines || {};
    window.__timelines['h07-quote-highlight'] = tl;
    window.__READY = true;
  }
  init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>h06 — Big number circle (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: center; justify-content: center; gap: 40px; text-align: center; }

  .lead { margin: 0; font-size: 40px; font-weight: 600; color: var(--ink-soft); opacity: 0; }

  .big-wrap { position: relative; padding: 30px 70px; }
  .big {
    margin: 0;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 230px; line-height: 1;
    letter-spacing: -.04em; color: var(--ink);
    opacity: 0;
  }
  .big small { font-size: .38em; font-weight: 700; letter-spacing: -.01em; color: var(--ink-soft); }

  /* Nét khoanh tròn tay vẽ quanh con số: elip hở đầu, 1.5 vòng */
  .ring { position: absolute; inset: -34px -30px; overflow: visible; }
  .ring path { fill: none; stroke: var(--plum); stroke-width: 10; stroke-linecap: round; }

  /* .tail 34px box 936 = ~64 ký tự */
  .tail { margin: 0; font-size: 34px; line-height: 1.5; color: var(--ink-soft); opacity: 0; }
  .tail .accent { font-size: 38px; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <div class="eyebrow" style="--dot: var(--peach)">Con số đáng nhớ</div>
    <p class="lead">Thời gian đọc tin AI mỗi sáng còn</p>

    <div class="big-wrap">
      <h1 class="big">2<small> phút</small></h1>
      <svg class="ring" viewBox="0 0 460 330">
        <path class="ring-path" d="M 240 22 C 90 10, 18 80, 22 165 C 26 262, 140 314, 240 308 C 352 302, 438 250, 434 160 C 430 74, 340 24, 220 30 C 140 34, 60 70, 44 130"/>
      </svg>
    </div>

    <p class="tail">thay vì <span class="accent">45 phút</span> lướt đủ mọi nguồn</p>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  async function init() {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const DUR = 5.5;
    const tl = gsap.timeline({ paused: true });
    const EASE = 'power3.out';

    const ring = document.querySelector('.ring-path');
    const len = ring.getTotalLength();
    gsap.set(ring, { strokeDasharray: len, strokeDashoffset: len });

    tl.fromTo('.eyebrow', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .4, ease: EASE }, .10)
      .fromTo('.lead', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .45, ease: EASE }, .30)
      // Số đập vào với overshoot mạnh (hook rule: chỉ h01/h02/h06 được phép)
      .fromTo('.big', { opacity: 0, scale: .55, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: .6, ease: 'back.out(1.8)' }, .62);

    // Bút khoanh 1 vòng rưỡi quanh con số — nhanh dần rồi hãm như tay thật
    tl.to(ring, { strokeDashoffset: 0, duration: .85, ease: 'power2.inOut' }, 1.35);

    tl.fromTo('.tail', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, 2.15);

    // Idle: cả cụm số nhún rất nhẹ
    tl.to('.big-wrap', { scale: 1.02, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 2, transformOrigin: '50% 50%' }, 2.8);

    tl.set({}, {}, DUR);
    window.__TL = tl;
    window.__DUR = DUR;
    window.__timelines = window.__timelines || {};
    window.__timelines['h06-big-number-circle'] = tl;
    window.__READY = true;
  }
  init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>h02 — Hook typing (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: flex-start; justify-content: center; gap: 44px; }

  /* Hook gõ từng CỤM TỪ (word-stagger, không mutate text). .headline 76px = 29 ký tự/dòng */
  .type-line { display: block; }
  .type-line .w { display: inline-block; opacity: 0; }

  /* Caret: thanh dọc nháy hữu hạn, đứng sau chữ */
  .caret {
    display: inline-block; width: 7px; height: 0.92em;
    margin-left: 10px; vertical-align: -0.12em;
    background: var(--plum); border-radius: 3px;
    opacity: 0;
  }

  .kicker { opacity: 0; }
  .kicker p { margin: 0; font-size: 32px; line-height: 1.5; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <div class="eyebrow" style="--dot: var(--peach); align-self: flex-start;">Câu hỏi</div>

    <h1 class="headline type-line">
      <span class="w">Mỗi</span> <span class="w">sáng</span> <span class="w">bạn</span> <span class="w">mất</span>
      <span class="w"><span class="accent">bao lâu</span></span>
      <span class="w">để</span> <span class="w">đọc</span> <span class="w">hết</span> <span class="w">tin</span> <span class="w">AI?</span><span class="caret"></span>
    </h1>

    <div class="kicker">
      <p>Con agent trong video này làm việc đó trong 2 phút, tự động, mỗi ngày.</p>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  async function init() {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    const DUR = 5.5;
    const tl = gsap.timeline({ paused: true });
    const EASE = 'power3.out';

    tl.fromTo('.eyebrow', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .4, ease: EASE }, .10);

    // Caret hiện trước, chờ 1 nhịp như người đặt tay lên phím
    tl.to('.caret', { opacity: 1, duration: .12 }, .42);

    // Gõ từng cụm: mỗi từ pop nhẹ, nhịp không đều (stagger từng khối)
    const words = gsap.utils.toArray('.type-line .w');
    let t = 0.72;
    words.forEach((w, i) => {
      tl.fromTo(w, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .09, ease: 'none' }, t);
      // nhịp gõ: cụm dài dừng lâu hơn chút, thêm khựng nhẹ sau dấu phẩy/cụm accent
      t += .13 + (w.textContent.length > 6 ? .06 : 0) + (i === 4 ? .22 : 0);
    });

    // Caret nháy hữu hạn trong lúc gõ + sau khi gõ xong
    tl.to('.caret', { opacity: 0, duration: .01, ease: 'none', yoyo: true, repeat: 7, repeatDelay: .38 }, .8);

    tl.fromTo('.kicker', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5, ease: EASE }, t + .5);

    tl.set({}, {}, DUR);
    window.__TL = tl;
    window.__DUR = DUR;
    window.__timelines = window.__timelines || {};
    window.__timelines['h02-hook-typing'] = tl;
    window.__READY = true;
  }
  init();
})();
</script>
</body>
</html>

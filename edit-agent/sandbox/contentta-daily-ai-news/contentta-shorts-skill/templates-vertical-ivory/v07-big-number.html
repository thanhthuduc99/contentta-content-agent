<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>v07 — Big number (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: center; justify-content: center; gap: 34px; }
  .eyebrow { opacity: 0; }

  .glow {
    position: absolute; left: 50%; top: 46%; width: 1020px; height: 1020px;
    transform: translate(-50%, -50%) scale(.84); opacity: 0;
    background: radial-gradient(circle, rgba(226,100,58,.16), transparent 62%);
    filter: blur(20px); z-index: 1;
  }

  .num {
    display: flex; align-items: baseline; justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 206px; line-height: .98; letter-spacing: -.05em; color: var(--ink);
  }
  .num .d { display: inline-block; opacity: 0; }
  .unit {
    font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600;
    font-size: 56px; letter-spacing: -.01em; color: var(--ink-soft);
    margin-left: 16px; opacity: 0;
  }

  .sub { text-align: center; max-width: 840px; opacity: 0; }

  .delta {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 18px 32px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line);
    box-shadow: var(--shadow-soft);
    font-size: 30px; font-weight: 600; color: var(--ink);
    opacity: 0;
  }
  .delta img { width: 34px; height: 34px; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="eyebrow" style="--dot: var(--gold)">Con số của hôm nay</div>

    <div class="num tabnum">
      <span class="d">3</span><span class="d">2</span><span class="d">.</span><span class="d">2</span><span class="d">2</span><span class="d">7</span>
      <span class="unit">sao</span>
    </div>

    <div class="delta"><img src="../shared/emoji/high_voltage.png" alt="">2.461 fork · 2.068 commit</div>

    <p class="sub">Một repo hạ tầng bộ nhớ cho agent, viết bằng Python, giấy phép AGPL-3.0</p>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  const DUR = 5.5;
  const tl = gsap.timeline({ paused: true });
  const EASE = 'power3.out';

  // v07 nằm trong nhóm được overshoot mạnh (con số phải đóng đinh)
  tl.fromTo('.glow',    { opacity: 0, scale: .84 },        { opacity: 1, scale: 1, duration: .9, ease: 'power2.out' }, 0)
    .fromTo('.eyebrow', { opacity: 0, y: 18 },             { opacity: 1, y: 0, duration: .4, ease: EASE }, .10)
    .fromTo('.num .d',  { opacity: 0, y: 66, scale: .84 }, { opacity: 1, y: 0, scale: 1, duration: .52, ease: 'back.out(1.7)', stagger: .07 }, .34)
    .fromTo('.unit',    { opacity: 0, x: -18 },            { opacity: 1, x: 0, duration: .42, ease: EASE }, .92)
    .fromTo('.delta',   { opacity: 0, y: 22, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: 'back.out(1.5)' }, 1.24)
    .fromTo('.sub',     { opacity: 0, y: 22 },             { opacity: 1, y: 0, duration: .48, ease: EASE }, 1.58);

  // Nhịp nhấn một lần lên con số, yoyo hữu hạn nên seek được
  tl.to('.num', { scale: 1.028, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 2.1);

  tl.set({}, {}, DUR);

  window.__TL = tl;
  window.__DUR = DUR;
  window.__timelines = window.__timelines || {};
  window.__timelines['v07-big-number'] = tl;
  document.fonts.ready.then(() => { window.__READY = true; });
})();
</script>
</body>
</html>

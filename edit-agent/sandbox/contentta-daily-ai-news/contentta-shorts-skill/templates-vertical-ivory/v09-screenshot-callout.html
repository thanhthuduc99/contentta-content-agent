<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>v09 — Screenshot callout (dọc 1080x1920)</title>
<link rel="stylesheet" href="../shared/fonts/brand-fonts.css">
<link rel="stylesheet" href="base-vertical.css">
<style>
  .content { align-items: center; justify-content: center; gap: 44px; }

  .head { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .eyebrow { opacity: 0; }
  .headline { text-align: center; opacity: 0; }

  /* Ảnh chụp nguyên khung 16:9 (2560x1440), thu nhỏ chứ không cắt.
     936px là hết bề ngang content, ảnh cao 527px. */
  .shot-wrap { position: relative; width: 936px; opacity: 0; }
  .shot { position: relative; }
  .shot img { width: 100%; }
  /* Ảnh thật nền trắng trên nền kem: viền trong mảnh giữ cho hai sắc trắng không dính vào nhau */
  .shot::after {
    content: ''; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(23,19,13,.10);
  }

  /* Ảnh 16:9 thu nhỏ thì chữ bên trong nhỏ, nên callout gánh phần thông tin.
     Đặt straddle mép trên/dưới, lệch trái/phải, không đè vào giữa ảnh. */
  .callout { position: absolute; opacity: 0; white-space: nowrap; font-size: 29px; padding: 17px 28px; }
  .callout.c1 { top: -28px; left: 40px; }
  .callout.c2 { bottom: -28px; right: 40px; }

  .stat {
    display: inline-flex; align-items: baseline; gap: 16px; opacity: 0;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 66px; letter-spacing: -.03em; color: var(--ink);
  }
  .stat small { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 31px; color: var(--ink-soft); letter-spacing: 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span></div>
  <div class="bg-dots"></div>
  <div class="bg-floor"></div>
  <div class="bg-grain"></div>

  <div class="content">
    <div class="head">
      <div class="eyebrow" style="--dot: var(--sky)">Nhìn thẳng vào repo</div>
      <h2 class="headline sm">Repo này đang <span class="accent">rất nóng</span></h2>
    </div>

    <div class="shot-wrap">
      <div class="shot">
        <div class="shot-bar"><i></i><i></i><i></i></div>
        <img src="demo-assets/gh-repo-169.png" alt="">
      </div>
      <div class="callout c1">Context database cho AI agent</div>
      <div class="callout c2">2.068 commit, đẩy code hôm qua</div>
    </div>

    <div class="stat tabnum">32.227 <small>sao · 2.461 fork · AGPL-3.0</small></div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  const DUR = 6.0;
  const tl = gsap.timeline({ paused: true });
  const EASE = 'power3.out';

  tl.fromTo('.eyebrow',    { opacity: 0, y: 18 },             { opacity: 1, y: 0, duration: .4, ease: EASE }, 0)
    .fromTo('.headline',   { opacity: 0, y: 26 },             { opacity: 1, y: 0, duration: .5, ease: EASE }, .14)
    .fromTo('.shot-wrap',  { opacity: 0, y: 44, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: EASE }, .44)
    .fromTo('.callout.c1', { opacity: 0, y: 14, scale: .92 }, { opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.6)' }, 1.16)
    .fromTo('.callout.c2', { opacity: 0, y: -14, scale: .92 },{ opacity: 1, y: 0, scale: 1, duration: .42, ease: 'back.out(1.6)' }, 1.62)
    .fromTo('.stat',       { opacity: 0, y: 22 },             { opacity: 1, y: 0, duration: .45, ease: EASE }, 2.20);

  // Parallax nhẹ — DS: parallax is subtle
  tl.fromTo('.shot-wrap', { yPercent: 0 }, { yPercent: -1.2, duration: DUR - 1.2, ease: 'none' }, 1.2);

  tl.set({}, {}, DUR);

  window.__TL = tl;
  window.__DUR = DUR;
  window.__timelines = window.__timelines || {};
  window.__timelines['v09-screenshot-callout'] = tl;
  document.fonts.ready.then(() => { window.__READY = true; });
})();
</script>
</body>
</html>
